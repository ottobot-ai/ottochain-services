# OttoChain Services - Docker Compose
# 
# Usage:
#   docker compose up -d
#   docker compose logs -f bridge
#   docker compose pull && docker compose up -d  # upgrade
#
# Required env vars (set in .env or environment):
#   DATABASE_URL, METAGRAPH_ML0_URL, METAGRAPH_DL1_URL
#
# Network: requires `docker network create ottochain` first (shared with deploy stack)
# For standalone use, change networks.ottochain to `driver: bridge`

version: '3.8'

services:
  gateway:
    image: ghcr.io/ottobot-ai/ottochain-services:${SERVICES_VERSION:-latest}
    container_name: gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - SERVICE=gateway
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - METAGRAPH_ML0_URL=${METAGRAPH_ML0_URL}
      - METAGRAPH_DL1_URL=${METAGRAPH_DL1_URL}
      - GL0_URL=${GL0_URL}
      - GL0_URLS=${GL0_URLS:-${GL0_URL}}
      - ML0_URLS=${ML0_URLS:-${ML0_URL}}
      - CL1_URLS=${CL1_URLS:-${CL1_URL}}
      - DL1_URLS=${DL1_URLS:-${DL1_URL}}
      - METAGRAPH_ID=${METAGRAPH_ID}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  bridge:
    image: ghcr.io/ottobot-ai/ottochain-services:${SERVICES_VERSION:-latest}
    container_name: bridge
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - SERVICE=bridge
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - METAGRAPH_ML0_URL=${METAGRAPH_ML0_URL}
      - METAGRAPH_DL1_URL=${METAGRAPH_DL1_URL}
      - GL0_URL=${GL0_URL}
      - GL0_URLS=${GL0_URLS:-${GL0_URL}}
      - ML0_URLS=${ML0_URLS:-${ML0_URL}}
      - CL1_URLS=${CL1_URLS:-${CL1_URL}}
      - DL1_URLS=${DL1_URLS:-${DL1_URL}}
      - METAGRAPH_ID=${METAGRAPH_ID}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  indexer:
    image: ghcr.io/ottobot-ai/ottochain-services:${SERVICES_VERSION:-latest}
    container_name: indexer
    restart: unless-stopped
    ports:
      - "3031:3031"
    environment:
      - SERVICE=indexer
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - METAGRAPH_ML0_URL=${METAGRAPH_ML0_URL}
      - METAGRAPH_DL1_URL=${METAGRAPH_DL1_URL}
      - GL0_URL=${GL0_URL}
      - GL0_URLS=${GL0_URLS:-${GL0_URL}}
      - ML0_URLS=${ML0_URLS:-${ML0_URL}}
      - CL1_URLS=${CL1_URLS:-${CL1_URL}}
      - DL1_URLS=${DL1_URLS:-${DL1_URL}}
      - METAGRAPH_ID=${METAGRAPH_ID}
      - INDEXER_PORT=3031
      - INDEXER_CALLBACK_URL=${INDEXER_CALLBACK_URL:-http://indexer:3031/webhook/snapshot}
    depends_on:
      - postgres
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3031/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  monitor:
    image: ghcr.io/ottobot-ai/ottochain-services:${SERVICES_VERSION:-latest}
    container_name: monitor
    restart: unless-stopped
    ports:
      - "3032:3032"
    environment:
      - SERVICE=monitor
      - MONITOR_AUTH=false
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - METAGRAPH_ML0_URL=${METAGRAPH_ML0_URL}
      - METAGRAPH_DL1_URL=${METAGRAPH_DL1_URL}
      - GL0_URL=${GL0_URL}
      - GL0_URLS=${GL0_URLS:-${GL0_URL}}
      - ML0_URLS=${ML0_URLS:-${ML0_URL}}
      - CL1_URLS=${CL1_URLS:-${CL1_URL}}
      - DL1_URLS=${DL1_URLS:-${DL1_URL}}
      - METAGRAPH_ID=${METAGRAPH_ID}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3032/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  traffic-gen:
    image: ghcr.io/ottobot-ai/ottochain-services:${SERVICES_VERSION:-latest}
    container_name: traffic-gen
    restart: unless-stopped
    ports:
      - "3033:3033"
    environment:
      - SERVICE=traffic-generator
      - NODE_ENV=production
      - BRIDGE_URL=http://bridge:3030
      - ML0_URL=${METAGRAPH_ML0_URL}
      - INDEXER_URL=http://indexer:3031
      - TRAFFIC_INTERVAL=${TRAFFIC_INTERVAL:-5000}
      - TRAFFIC_BATCH_SIZE=${TRAFFIC_BATCH_SIZE:-3}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - bridge
      - indexer
      - postgres
    networks:
      - ottochain

  explorer:
    image: ghcr.io/ottobot-ai/ottochain-explorer:${EXPLORER_VERSION:-latest}
    container_name: explorer
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure (can be external if needed)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ottochain}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ottochain}
      - POSTGRES_DB=${POSTGRES_DB:-ottochain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ottochain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ottochain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ottochain
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Prometheus Exporters ===
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-ottochain}:${POSTGRES_PASSWORD:-ottochain}@postgres:5432/${POSTGRES_DB:-ottochain}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ottochain

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ottochain

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - ottochain

networks:
  ottochain:
    # Use external network when running via ottochain-deploy (docker network create ottochain)
    # For standalone: change to `driver: bridge` and remove `external: true`
    external: true
    name: ottochain

volumes:
  postgres_data:
  redis_data:
