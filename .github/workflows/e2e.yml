name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_from_source:
        description: 'Build ottochain metagraph from source instead of using release JARs'
        required: false
        type: boolean
        default: false
      ottochain_ref:
        description: 'OttoChain branch/tag (only used when build_from_source=true)'
        required: false
        type: string
      ottochain_repo:
        description: 'OttoChain repo (only used when build_from_source=true)'
        required: false
        type: string
        default: 'ottobot-ai/ottochain'

env:
  NODE_VERSION: '20'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ottochain
          POSTGRES_PASSWORD: ottochain
          POSTGRES_DB: ottochain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ottochain -d ottochain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h /

      - name: Checkout ottochain-services
        uses: actions/checkout@v6

      # ── Decide build mode ──────────────────────────────────────────────
      # Build from source when:
      #   1. workflow_dispatch with build_from_source=true
      #   2. PR has 'build-from-source' label
      # Otherwise: download released JARs (faster)
      - name: Determine build mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM_SOURCE="false"

          # Check workflow_dispatch input
          if [ "${{ inputs.build_from_source }}" = "true" ]; then
            FROM_SOURCE="true"
            echo "Build from source: workflow_dispatch input"
          fi

          # Check PR label
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -q "build-from-source"; then
              FROM_SOURCE="true"
              echo "Build from source: PR label"
            fi
          fi

          echo "from_source=${FROM_SOURCE}" >> $GITHUB_OUTPUT
          echo "Mode: $([ "$FROM_SOURCE" = "true" ] && echo "BUILD FROM SOURCE" || echo "RELEASED JARS")"

      # ══════════════════════════════════════════════════════════════════
      # PATH A: Build from source
      # ══════════════════════════════════════════════════════════════════

      - name: Resolve ottochain ref
        if: steps.mode.outputs.from_source == 'true'
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ inputs.ottochain_repo || 'ottobot-ai/ottochain' }}"
          REF="${{ inputs.ottochain_ref }}"

          if [ -z "$REF" ]; then
            # For PRs: try matching branch name on ottochain, fall back to main
            PR_BRANCH="${{ github.head_ref }}"
            if [ -n "$PR_BRANCH" ]; then
              if gh api "repos/${REPO}/branches/${PR_BRANCH}" --jq '.name' >/dev/null 2>&1; then
                REF="$PR_BRANCH"
                echo "Using matching branch: ${REPO}@${REF}"
              else
                REF="main"
                echo "No matching branch '${PR_BRANCH}' on ${REPO}, using main"
              fi
            else
              REF="main"
            fi
          fi

          echo "ottochain_ref=${REF}" >> $GITHUB_OUTPUT
          echo "ottochain_repo=${REPO}" >> $GITHUB_OUTPUT
          echo "Building ottochain from ${REPO}@${REF}"

      - name: Checkout ottochain (source)
        if: steps.mode.outputs.from_source == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.resolve.outputs.ottochain_repo }}
          ref: ${{ steps.resolve.outputs.ottochain_ref }}
          path: ottochain

      - name: Set up Java
        if: steps.mode.outputs.from_source == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        if: steps.mode.outputs.from_source == 'true'
        uses: sbt/setup-sbt@v1

      - name: Resolve tessellation version (from source)
        if: steps.mode.outputs.from_source == 'true'
        id: versions-source
        working-directory: ottochain
        run: |
          METAKIT_VER=$(grep 'val metakit =' project/Dependencies.scala | head -1 | grep -o '"[^"]*"' | tr -d '"')
          echo "metakit=${METAKIT_VER}" >> $GITHUB_OUTPUT

          TESS_VER=$(curl -sf "https://repo1.maven.org/maven2/io/constellationnetwork/metakit_2.13/${METAKIT_VER}/metakit_2.13-${METAKIT_VER}.pom" \
            | grep -A1 'tessellation-sdk' | grep '<version>' | grep -o '[0-9][^<]*')
          echo "tessellation=${TESS_VER}" >> $GITHUB_OUTPUT
          echo "Dependency chain: ottochain → metakit ${METAKIT_VER} → tessellation ${TESS_VER}"

      - name: Clone tessellation infrastructure (from source)
        if: steps.mode.outputs.from_source == 'true'
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/Constellation-Labs/tessellation.git tessellation

      - name: Download tessellation release JARs (from source)
        if: steps.mode.outputs.from_source == 'true'
        run: |
          TESS_TAG="v${{ steps.versions-source.outputs.tessellation }}"
          BASE_URL="https://github.com/Constellation-Labs/tessellation/releases/download/${TESS_TAG}"
          JARS_DIR="tessellation/docker/jars"
          mkdir -p "$JARS_DIR"

          echo "Downloading tessellation JARs from release ${TESS_TAG}..."
          declare -A JAR_MAP=(
            ["cl-node.jar"]="gl0.jar"
            ["cl-dag-l1.jar"]="gl1.jar"
            ["cl-keytool.jar"]="keytool.jar"
            ["cl-wallet.jar"]="wallet.jar"
          )

          for release_name in "${!JAR_MAP[@]}"; do
            local_name="${JAR_MAP[$release_name]}"
            echo "  ${release_name} → ${local_name}"
            curl -fsSL -o "${JARS_DIR}/${local_name}" "${BASE_URL}/${release_name}"
            echo "    ✓ $(stat -c%s "${JARS_DIR}/${local_name}") bytes"
          done

      - name: Build metagraph JARs
        if: steps.mode.outputs.from_source == 'true'
        working-directory: ottochain
        run: sbt --error "currencyL0/assembly" "currencyL1/assembly" "dataL1/assembly"

      - name: Stage metagraph JARs (from source)
        if: steps.mode.outputs.from_source == 'true'
        run: |
          for layer in l0:ml0 l1:cl1 data_l1:dl1; do
            module="${layer%%:*}"; target="${layer#*:}"
            jar=$(ls -1t ottochain/modules/${module}/target/scala-2.13/*-assembly*.jar | head -1)
            cp "$jar" tessellation/docker/jars/${target}.jar
            echo "✓ ${target}.jar ($(stat -c%s "$jar") bytes)"
          done
          ls -la tessellation/docker/jars/

      # ══════════════════════════════════════════════════════════════════
      # PATH B: Download released JARs
      # ══════════════════════════════════════════════════════════════════

      - name: Fetch versions.yaml (released)
        if: steps.mode.outputs.from_source != 'true'
        id: versions-released
        run: |
          curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://raw.githubusercontent.com/ottobot-ai/ottochain-deploy/main/versions.yaml" \
            -o versions.yaml

          OTTOCHAIN_VER=$(grep -A1 'ottochain:' versions.yaml | grep 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TESS_VER=$(grep -A1 'tessellation:' versions.yaml | grep 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [[ "$TESS_VER" != v* ]] && TESS_VER="v${TESS_VER}"

          echo "ottochain_version=${OTTOCHAIN_VER}" >> $GITHUB_OUTPUT
          echo "tessellation=${TESS_VER}" >> $GITHUB_OUTPUT
          echo "Resolved versions: OttoChain=${OTTOCHAIN_VER}, Tessellation=${TESS_VER}"

      - name: Checkout tessellation (released)
        if: steps.mode.outputs.from_source != 'true'
        uses: actions/checkout@v6
        with:
          repository: Constellation-Labs/tessellation
          path: tessellation
          ref: ${{ steps.versions-released.outputs.tessellation }}

      - name: Download pre-built JARs (released)
        if: steps.mode.outputs.from_source != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESS_VER: ${{ steps.versions-released.outputs.tessellation }}
          OTTO_VER: ${{ steps.versions-released.outputs.ottochain_version }}
        run: |
          echo "Downloading tessellation ${TESS_VER} release JARs..."
          gh release download "${TESS_VER}" \
            --repo Constellation-Labs/tessellation \
            --pattern "cl-node.jar" \
            --pattern "cl-dag-l1.jar" \
            --pattern "cl-keytool.jar" \
            --pattern "cl-wallet.jar" \
            --dir /tmp/tess-jars/ \
            --clobber

          echo "Downloading OttoChain v${OTTO_VER} release JARs..."
          gh release download "v${OTTO_VER}" \
            --repo scasplte2/ottochain \
            --pattern "metagraph-l0-*.jar" \
            --pattern "currency-l1-*.jar" \
            --pattern "data-l1-*.jar" \
            --dir /tmp/otto-jars/ \
            --clobber

          # Stage tessellation JARs
          for mod in dag-l0 dag-l1 keytool wallet; do
            mkdir -p tessellation/modules/${mod}/target/scala-2.13
          done
          cp /tmp/tess-jars/cl-node.jar     tessellation/modules/dag-l0/target/scala-2.13/tessellation-dag-l0-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-dag-l1.jar   tessellation/modules/dag-l1/target/scala-2.13/tessellation-dag-l1-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-keytool.jar  tessellation/modules/keytool/target/scala-2.13/tessellation-keytool-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-wallet.jar   tessellation/modules/wallet/target/scala-2.13/tessellation-wallet-assembly-prebuilt.jar

          # Stage metagraph JARs
          DUMMY_META=/tmp/metagraph-dummy
          for mod in l0 l1 data_l1; do
            mkdir -p $DUMMY_META/modules/${mod}/target/scala-2.13
          done
          cp /tmp/otto-jars/metagraph-l0-*.jar $DUMMY_META/modules/l0/target/scala-2.13/ottochain-currency-l0-assembly-prebuilt.jar
          cp /tmp/otto-jars/currency-l1-*.jar  $DUMMY_META/modules/l1/target/scala-2.13/ottochain-currency-l1-assembly-prebuilt.jar
          cp /tmp/otto-jars/data-l1-*.jar      $DUMMY_META/modules/data_l1/target/scala-2.13/ottochain-data-l1-assembly-prebuilt.jar

          echo "✅ All JARs staged"

      # ══════════════════════════════════════════════════════════════════
      # SHARED: Start cluster and run tests
      # ══════════════════════════════════════════════════════════════════

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build services
        run: pnpm build

      - name: Push database schema
        env:
          DATABASE_URL: postgresql://ottochain:ottochain@localhost:5432/ottochain
        run: pnpm db:push

      - name: Write metagraph extra env
        run: |
          # ML0 needs WEBHOOK_URL set (to any value) to create the HTTP client
          # that powers webhook dispatch. Without it, the dispatcher is None and
          # no snapshot/rejection notifications are sent to subscribers.
          echo 'WEBHOOK_URL=http://webhook-enabled/' > /tmp/metagraph-extra.env

      - name: Start metagraph cluster
        working-directory: tessellation
        run: |
          if [ "${{ steps.mode.outputs.from_source }}" = "true" ]; then
            just up --hypergraph-release="v${{ steps.versions-source.outputs.tessellation }}" \
              --skip-assembly --metagraph="${GITHUB_WORKSPACE}/ottochain" --dl1 --data \
              --env=/tmp/metagraph-extra.env
          else
            chmod -R +x docker/bin/
            SKIP_METAGRAPH_ASSEMBLY=true PUBLISH=false \
              ./docker/bin/compose-runner.sh --up --skip-assembly --metagraph=/tmp/metagraph-dummy --dl1 \
              --env=/tmp/metagraph-extra.env
          fi

      - name: Wait for metagraph healthy
        run: |
          echo "=== Waiting for GL0 ==="
          for i in {1..90}; do
            if curl -s http://localhost:9000/node/info | grep -q '"state":"Ready"'; then
              echo "GL0 ready after ${i}s"; break
            fi
            sleep 1
            if [ $i -eq 90 ]; then echo "GL0 timeout"; docker logs gl0-0 2>&1 | tail -30 || true; exit 1; fi
          done

          echo "=== Waiting for ML0 (may take longer on CI) ==="
          for i in {1..180}; do
            if curl -s http://localhost:9200/node/info | grep -q '"state":"Ready"'; then
              echo "ML0 ready after ${i}s"; break
            fi
            sleep 1
            if [ $i -eq 180 ]; then echo "ML0 timeout"; docker logs ml0-0 2>&1 | tail -30 || true; exit 1; fi
          done

          echo "=== Waiting for DL1 cluster with robust join retry ==="
          cp $GITHUB_WORKSPACE/scripts/wait-for-cluster.sh ./wait-for-cluster.sh
          chmod +x ./wait-for-cluster.sh
          ./wait-for-cluster.sh dl1 "9400 9410 9420" 9400

          echo "=== Waiting for first metagraph snapshot ==="
          for i in {1..120}; do
            ordinal=$(curl -s http://localhost:9200/snapshots/latest | jq -r '.value.ordinal // 0' 2>/dev/null || echo "0")
            if [ "$ordinal" -gt 0 ]; then
              echo "Metagraph producing snapshots (ordinal: $ordinal) after ${i}s"
              break
            fi
            sleep 1
            if [ $i -eq 120 ]; then echo "Metagraph not producing snapshots"; exit 1; fi
          done

      - name: Verify DL1 cluster formation
        run: |
          PEER_0=$(curl -s http://localhost:9400/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")
          PEER_1=$(curl -s http://localhost:9410/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")
          PEER_2=$(curl -s http://localhost:9420/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")

          echo "DL1-0: ${PEER_0:0:32}..."
          echo "DL1-1: ${PEER_1:0:32}..."
          echo "DL1-2: ${PEER_2:0:32}..."

          for i in 0 1 2; do
            VAR="PEER_$i"
            VAL="${!VAR}"
            if [ -z "$VAL" ] || [ "$VAL" = "error" ] || [ "$VAL" = "unreachable" ]; then
              echo "❌ DL1-$i not responding!"
              docker logs "dl1-$i" 2>&1 | tail -20 || true
              exit 1
            fi
          done

          if [ "$PEER_0" = "$PEER_1" ] || [ "$PEER_0" = "$PEER_2" ] || [ "$PEER_1" = "$PEER_2" ]; then
            echo "❌ DL1 nodes have DUPLICATE peer IDs!"
            exit 1
          fi
          echo "✓ All DL1 nodes have unique peer IDs"

          # Verify DL1 cluster formed with all 3 nodes (retry up to 60s)
          echo "Waiting for DL1 cluster to reach size 3..."
          for i in $(seq 1 30); do
            cluster_size=$(curl -s http://localhost:9400/cluster/info | jq 'length' 2>/dev/null || echo "0")
            echo "  DL1 cluster size: $cluster_size (attempt $i/30)"
            if [ "$cluster_size" -ge 3 ] 2>/dev/null; then
              break
            fi
            # Re-trigger join for nodes not yet in cluster
            if [ "$i" -gt 1 ] && [ $(( i % 5 )) -eq 0 ]; then
              echo "  Retrying DL1 join..."
              for port in 9410 9420; do
                cli_port=$((port + 2))
                curl -s -X POST "http://localhost:${cli_port}/cluster/join" \
                  -H 'Content-Type: application/json' \
                  -d "{\"id\":\"${PEER_0}\",\"ip\":\"dl1-0\",\"p2pPort\":9401}" 2>/dev/null || true
              done
            fi
            sleep 2
          done
          if [ "$cluster_size" -lt 3 ] 2>/dev/null; then
            echo "❌ DL1 cluster size is $cluster_size, expected 3. Data consensus will not work!"
            echo "DL1-0 cluster info:"
            curl -s http://localhost:9400/cluster/info | jq '.' 2>/dev/null || true
            exit 1
          fi
          echo "✓ DL1 cluster size: $cluster_size"

      - name: Fetch METAGRAPH_ID from ML0
        run: |
          echo "Fetching metagraph ID from ML0 container..."
          # Get the token identifier directly from the ML0 node's environment.
          # This is the metagraph's DAG address — more reliable than waiting for
          # it to appear in GL0 stateChannelSnapshots, and correct when multiple
          # metagraphs share the same GL0 network.
          METAGRAPH_ID=$(docker exec ml0-0 printenv CL_TOKEN_ID 2>/dev/null || echo "")

          if [ -z "$METAGRAPH_ID" ]; then
            # Fallback: discover from GL0 combined state (full accumulated state,
            # not incremental — avoids missing the metagraph in sparse snapshots)
            echo "CL_TOKEN_ID not set in ml0-0, falling back to GL0 combined state..."
            for i in $(seq 1 60); do
              METAGRAPH_ID=$(curl -s http://localhost:9000/global-snapshots/latest/combined \
                | jq -r '.[0].value.stateChannelSnapshots | keys[0] // ""' 2>/dev/null || echo "")
              if [ -n "$METAGRAPH_ID" ] && [ "$METAGRAPH_ID" != "null" ]; then
                break
              fi
              if [ $i -eq 60 ]; then
                echo "❌ Could not determine METAGRAPH_ID from ML0 or GL0"
                docker exec ml0-0 env 2>/dev/null | grep -i token || true
                curl -s http://localhost:9000/global-snapshots/latest/combined \
                  | jq '.[0].value.stateChannelSnapshots | keys' 2>/dev/null || true
                exit 1
              fi
              echo "  Attempt $i/60: waiting for metagraph in GL0 combined state..."
              sleep 1
            done
          fi

          echo "✓ METAGRAPH_ID: $METAGRAPH_ID"
          echo "METAGRAPH_ID=$METAGRAPH_ID" >> $GITHUB_ENV

          # Verify ML0 is progressing by checking it appears in GL0 combined state
          echo "Verifying ML0 snapshots reach GL0..."
          for i in $(seq 1 30); do
            found=$(curl -s http://localhost:9000/global-snapshots/latest/combined \
              | jq -r --arg mid "$METAGRAPH_ID" '.[0].value.stateChannelSnapshots[$mid] // empty | length' 2>/dev/null || echo "0")
            if [ "$found" -gt 0 ] 2>/dev/null; then
              echo "✓ ML0 confirmed in GL0 combined state"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "⚠️ ML0 not yet visible in GL0 combined state (may appear later)"
            fi
            sleep 2
          done

      - name: Start Redis
        run: |
          docker run -d --name redis-ci -p 6379:6379 redis:alpine
          sleep 2
          docker exec redis-ci redis-cli ping

      - name: Build services Docker image
        run: |
          docker build -t ottochain-services:ci .
          echo "SERVICES_IMAGE=ottochain-services:ci" >> $GITHUB_ENV

      - name: Start services containers
        run: |
          docker compose -f docker-compose.ci.yaml up -d

          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            indexer_ok=$(curl -sf http://localhost:3031/health 2>/dev/null | grep -c '"status":"ok"' || echo "0")
            bridge_ok=$(curl -sf http://localhost:3030/health 2>/dev/null | grep -c '"status":"ok"' || echo "0")
            if [ "$indexer_ok" = "1" ] && [ "$bridge_ok" = "1" ]; then
              echo "✓ Both services healthy after ${i}s"; break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Services failed to become healthy"
              docker compose -f docker-compose.ci.yaml logs
              exit 1
            fi
            sleep 1
          done

          docker exec ml0-0 curl -sf http://indexer:3031/health
          echo "✓ ML0 can reach indexer directly on tessellation_common network"

      - name: Run webhook integration tests
        env:
          ML0_URL: http://localhost:9200
          INDEXER_URL: http://localhost:3031
          HOST_IP: indexer
        run: npx tsx scripts/test-webhook.ts

      - name: Run rejection notification E2E test
        env:
          BRIDGE_URL: http://localhost:3030
          ML0_URL: http://localhost:9200
          INDEXER_URL: http://localhost:3031
          DL1_URL: http://localhost:9400
          POLL_TIMEOUT: '90'
          DL1_SYNC_TIMEOUT: '60'
          MAX_RETRIES: '3'
        run: |
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt of $MAX_RETRIES ==="
            if npx tsx scripts/testing/test-rejection-notification-e2e.ts; then
              echo "✓ Test passed on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️ Test failed, waiting 5s before retry..."
              sleep 5
            fi
          done
          echo "❌ All $MAX_RETRIES attempts failed"
          exit 1

      - name: Run traffic generator integration test
        env:
          BRIDGE_URL: http://localhost:3030
          ML0_URL: http://localhost:9200
          INDEXER_URL: http://localhost:3031
          FIBER_WAIT_TIMEOUT: '90'
          DL1_SYNC_WAIT: '15'
          ACTIVATION_WAIT: '10'
          INDEXER_WAIT_TIMEOUT: '30000'
          MAX_RETRIES: '5'
        run: |
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt of $MAX_RETRIES ==="
            if npx tsx packages/traffic-generator/test/integration.test.ts; then
              echo "✓ Test passed on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️ Test failed, waiting 10s before retry..."
              sleep 10
            fi
          done
          echo "❌ All $MAX_RETRIES attempts failed"
          exit 1

      - name: Collect logs on failure
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/ci-logs

          echo "=== Build Mode ==="
          echo "From source: ${{ steps.mode.outputs.from_source }}"
          if [ "${{ steps.mode.outputs.from_source }}" = "true" ]; then
            echo "OttoChain: ${{ steps.resolve.outputs.ottochain_repo }}@${{ steps.resolve.outputs.ottochain_ref }}"
            echo "Metakit: ${{ steps.versions-source.outputs.metakit }}"
            echo "Tessellation: ${{ steps.versions-source.outputs.tessellation }}"
          else
            echo "OttoChain: ${{ steps.versions-released.outputs.ottochain_version }} (released)"
            echo "Tessellation: ${{ steps.versions-released.outputs.tessellation }} (released)"
          fi

          echo "=== Container list ==="
          docker ps -a | tee /tmp/ci-logs/containers.txt || true

          for c in gl0-0 ml0-0 dl1-0 dl1-1 dl1-2 indexer bridge; do
            echo "=== $c Logs ==="
            docker logs "$c" 2>&1 | tee /tmp/ci-logs/${c}.log | tail -100 || true
          done

      - name: Upload node logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-${{ github.run_number }}
          path: /tmp/ci-logs/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yaml down 2>/dev/null || true
          docker rm -f redis-ci 2>/dev/null || true
          cd tessellation && just down 2>/dev/null || docker compose down -v 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $([ "${{ steps.mode.outputs.from_source }}" = "true" ] && echo "🔧 Built from source" || echo "📦 Released JARs") |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.mode.outputs.from_source }}" = "true" ]; then
            echo "| OttoChain | ${{ steps.resolve.outputs.ottochain_repo }}@${{ steps.resolve.outputs.ottochain_ref }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Metakit | ${{ steps.versions-source.outputs.metakit }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tessellation | ${{ steps.versions-source.outputs.tessellation }} (release JARs + develop infra) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| OttoChain | ${{ steps.versions-released.outputs.ottochain_version }} (released) |" >> $GITHUB_STEP_SUMMARY
            echo "| Tessellation | ${{ steps.versions-released.outputs.tessellation }} (released) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Services | $(git rev-parse --short HEAD) |" >> $GITHUB_STEP_SUMMARY
