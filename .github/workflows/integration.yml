name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ottochain_version:
        description: 'OttoChain metagraph version override (e.g., 0.7.6)'
        required: false
        type: string
      tessellation_version:
        description: 'Tessellation version override (e.g., v4.0.0-rc.2)'
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ottochain
          POSTGRES_PASSWORD: ottochain
          POSTGRES_DB: ottochain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ottochain -d ottochain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h /

      - name: Checkout ottochain-services
        uses: actions/checkout@v6

      # ── Resolve versions from deploy repo's versions.yaml ──────────────
      - name: Fetch versions.yaml
        id: versions
        run: |
          echo "Fetching versions.yaml from ottochain-deploy..."
          curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://raw.githubusercontent.com/ottobot-ai/ottochain-deploy/main/versions.yaml" \
            -o versions.yaml

          # Parse versions (workflow_dispatch inputs override versions.yaml)
          OTTOCHAIN_VER="${{ inputs.ottochain_version }}"
          TESS_VER="${{ inputs.tessellation_version }}"

          if [ -z "$OTTOCHAIN_VER" ]; then
            OTTOCHAIN_VER=$(grep -A1 'ottochain:' versions.yaml | grep 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          if [ -z "$TESS_VER" ]; then
            TESS_VER=$(grep -A1 'tessellation:' versions.yaml | grep 'version:' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi

          # Ensure tessellation version has v prefix for release tag
          [[ "$TESS_VER" != v* ]] && TESS_VER="v${TESS_VER}"

          echo "ottochain_version=${OTTOCHAIN_VER}" >> $GITHUB_OUTPUT
          echo "tessellation_version=${TESS_VER}" >> $GITHUB_OUTPUT
          echo "Resolved versions: OttoChain=${OTTOCHAIN_VER}, Tessellation=${TESS_VER}"

      # ── Checkout tessellation (for compose infrastructure only) ────────
      - name: Checkout tessellation
        uses: actions/checkout@v6
        with:
          repository: Constellation-Labs/tessellation
          path: tessellation
          ref: ${{ steps.versions.outputs.tessellation_version }}

      # ── Download pre-built JARs instead of building from source ────────
      - name: Download pre-built JARs
        env:
          GH_TOKEN: ${{ github.token }}
          TESS_VER: ${{ steps.versions.outputs.tessellation_version }}
          OTTO_VER: ${{ steps.versions.outputs.ottochain_version }}
        run: |
          # Download tessellation release JARs
          echo "Downloading tessellation ${TESS_VER} release JARs..."
          gh release download "${TESS_VER}" \
            --repo Constellation-Labs/tessellation \
            --pattern "cl-node.jar" \
            --pattern "cl-dag-l1.jar" \
            --pattern "cl-keytool.jar" \
            --pattern "cl-wallet.jar" \
            --dir /tmp/tess-jars/ \
            --clobber

          # Download OttoChain release JARs
          echo "Downloading OttoChain v${OTTO_VER} release JARs..."
          gh release download "v${OTTO_VER}" \
            --repo scasplte2/ottochain \
            --pattern "metagraph-l0-*.jar" \
            --pattern "currency-l1-*.jar" \
            --pattern "data-l1-*.jar" \
            --dir /tmp/otto-jars/ \
            --clobber

          # Place JARs where compose-runner's assembly.sh expects them:
          # Tessellation: modules/{module}/target/scala-2.13/tessellation-{module}-assembly-*.jar
          # Metagraph: $METAGRAPH/modules/{path}/target/scala-2.13/*-assembly-*.jar
          #
          # assembly.sh checks these paths, copies to docker/jars/, then docker build uses them.
          # By pre-populating, we skip all sbt compilation.

          # Tessellation JARs → modules/*/target/scala-2.13/
          for mod in dag-l0 dag-l1 keytool wallet; do
            mkdir -p tessellation/modules/${mod}/target/scala-2.13
          done
          cp /tmp/tess-jars/cl-node.jar     tessellation/modules/dag-l0/target/scala-2.13/tessellation-dag-l0-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-dag-l1.jar   tessellation/modules/dag-l1/target/scala-2.13/tessellation-dag-l1-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-keytool.jar  tessellation/modules/keytool/target/scala-2.13/tessellation-keytool-assembly-prebuilt.jar
          cp /tmp/tess-jars/cl-wallet.jar   tessellation/modules/wallet/target/scala-2.13/tessellation-wallet-assembly-prebuilt.jar

          # OttoChain JARs → dummy metagraph dir (used by compose-runner --metagraph)
          DUMMY_META=/tmp/metagraph-dummy
          for mod in l0 l1 data_l1; do
            mkdir -p $DUMMY_META/modules/${mod}/target/scala-2.13
          done
          cp /tmp/otto-jars/metagraph-l0-*.jar $DUMMY_META/modules/l0/target/scala-2.13/ottochain-currency-l0-assembly-prebuilt.jar
          cp /tmp/otto-jars/currency-l1-*.jar  $DUMMY_META/modules/l1/target/scala-2.13/ottochain-currency-l1-assembly-prebuilt.jar
          cp /tmp/otto-jars/data-l1-*.jar      $DUMMY_META/modules/data_l1/target/scala-2.13/ottochain-data-l1-assembly-prebuilt.jar

          echo "✅ All JARs staged for compose-runner"
          echo "Tessellation JARs:"
          ls -lh tessellation/modules/dag-l0/target/scala-2.13/
          echo "OttoChain JARs:"
          ls -lh $DUMMY_META/modules/l0/target/scala-2.13/

      # ── Setup for services build ──────────────────────────────────────
      # No Java/sbt needed — using pre-built JARs from GitHub Releases.
      # Tessellation's compose-runner uses pre-existing test keys (no keytool).
      # Genesis runs inside Docker containers.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build services
        run: pnpm build

      - name: Push database schema
        env:
          DATABASE_URL: postgresql://ottochain:ottochain@localhost:5432/ottochain
        run: pnpm db:push --skip-generate

      # ── Start metagraph cluster from pre-built JARs ───────────────────
      # Note: compose-runner handles docker build internally from docker/jars/
      - name: Start metagraph cluster
        working-directory: tessellation/docker
        run: |
          chmod +x bin/*.sh

          # Enable webhook feature for ML0
          sed -i 's/- CL_DOCKER_ID=ml0/- WEBHOOK_URL=http:\/\/webhook-enabled\/\n      - CL_DOCKER_ID=ml0/' docker-compose.metagraph.yaml

          # Run compose-runner with --skip-assembly.
          # Pre-built JARs are already in modules/*/target/ (tessellation) and
          # /tmp/metagraph-dummy/modules/*/target/ (ottochain).
          # assembly.sh finds them, skips sbt, copies to docker/jars/, builds image.
          SKIP_METAGRAPH_ASSEMBLY=true PUBLISH=false \
            ./bin/compose-runner.sh --up --skip-assembly --metagraph=/tmp/metagraph-dummy --dl1

      - name: Verify key distribution
        working-directory: tessellation
        run: |
          echo "=== Verifying keys were distributed to node directories ==="
          for i in 0 1 2; do
            echo "--- Node $i ---"
            if [ ! -f "nodes/$i/key.p12" ]; then
              echo "ERROR: nodes/$i/key.p12 not found!"
              ls -la nodes/$i/ || true
              exit 1
            fi
            key_hash=$(md5sum nodes/$i/key.p12 | cut -d' ' -f1)
            echo "Key hash: $key_hash"
          done

          hash0=$(md5sum nodes/0/key.p12 | cut -d' ' -f1)
          hash1=$(md5sum nodes/1/key.p12 | cut -d' ' -f1)
          hash2=$(md5sum nodes/2/key.p12 | cut -d' ' -f1)
          if [ "$hash0" = "$hash1" ] || [ "$hash0" = "$hash2" ] || [ "$hash1" = "$hash2" ]; then
            echo "ERROR: Key hashes are not all unique!"
            exit 1
          fi
          echo "✓ All node keys verified as unique"

      - name: Wait for metagraph healthy
        run: |
          cp $GITHUB_WORKSPACE/scripts/wait-for-cluster.sh ./wait-for-cluster.sh
          chmod +x ./wait-for-cluster.sh

          echo "=== Waiting for GL0 ==="
          for i in {1..90}; do
            if curl -s http://localhost:9000/node/info | grep -q '"state":"Ready"'; then
              echo "GL0 ready after ${i}s"; break
            fi
            sleep 1
            if [ $i -eq 90 ]; then echo "GL0 timeout"; docker logs gl0-0 2>&1 | tail -30 || true; exit 1; fi
          done

          echo "=== Waiting for ML0 (may take longer on CI) ==="
          for i in {1..180}; do
            if curl -s http://localhost:9200/node/info | grep -q '"state":"Ready"'; then
              echo "ML0 ready after ${i}s"; break
            fi
            sleep 1
            if [ $i -eq 180 ]; then echo "ML0 timeout"; docker logs ml0-0 2>&1 | tail -30 || true; exit 1; fi
          done

          echo "=== Waiting for DL1 cluster with robust join retry ==="
          ./wait-for-cluster.sh dl1 "9400 9410 9420" 9400

          echo "=== Waiting for first metagraph snapshot ==="
          for i in {1..120}; do
            ordinal=$(curl -s http://localhost:9200/snapshots/latest | jq -r '.value.ordinal // 0' 2>/dev/null || echo "0")
            if [ "$ordinal" -gt 0 ]; then
              echo "Metagraph producing snapshots (ordinal: $ordinal) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Metagraph not producing snapshots"
          curl -s http://localhost:9200/snapshots/latest | jq . || true
          docker logs ml0-0 2>&1 | tail -50 || true
          exit 1

      - name: Verify DL1 cluster formation
        run: |
          PEER_0=$(curl -s http://localhost:9400/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")
          PEER_1=$(curl -s http://localhost:9410/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")
          PEER_2=$(curl -s http://localhost:9420/node/info | jq -r '.id // "error"' 2>/dev/null || echo "unreachable")

          echo "DL1-0: ${PEER_0:0:32}..."
          echo "DL1-1: ${PEER_1:0:32}..."
          echo "DL1-2: ${PEER_2:0:32}..."

          for i in 0 1 2; do
            VAR="PEER_$i"
            VAL="${!VAR}"
            if [ -z "$VAL" ] || [ "$VAL" = "error" ] || [ "$VAL" = "unreachable" ]; then
              echo "❌ DL1-$i not responding!"
              docker logs "dl1-$i" 2>&1 | tail -20 || true
              exit 1
            fi
          done

          if [ "$PEER_0" = "$PEER_1" ] || [ "$PEER_0" = "$PEER_2" ] || [ "$PEER_1" = "$PEER_2" ]; then
            echo "❌ DL1 nodes have DUPLICATE peer IDs!"
            exit 1
          fi
          echo "✓ All DL1 nodes have unique peer IDs"

          cluster_size=$(curl -s http://localhost:9400/cluster/info | jq 'length' 2>/dev/null || echo "0")
          echo "DL1 cluster size: $cluster_size"

      - name: Start Redis
        run: |
          docker run -d --name redis-ci -p 6379:6379 redis:alpine
          sleep 2
          docker exec redis-ci redis-cli ping

      - name: Build services Docker image
        run: |
          docker build -t ottochain-services:ci .
          echo "SERVICES_IMAGE=ottochain-services:ci" >> $GITHUB_ENV

      - name: Start services containers
        run: |
          docker compose -f docker-compose.ci.yaml up -d

          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            indexer_ok=$(curl -sf http://localhost:3031/health 2>/dev/null | grep -c '"status":"ok"' || echo "0")
            bridge_ok=$(curl -sf http://localhost:3030/health 2>/dev/null | grep -c '"status":"ok"' || echo "0")
            if [ "$indexer_ok" = "1" ] && [ "$bridge_ok" = "1" ]; then
              echo "✓ Both services healthy after ${i}s"; break
            fi
            if [ $i -eq 60 ]; then
              echo "❌ Services failed to become healthy"
              docker compose -f docker-compose.ci.yaml logs
              exit 1
            fi
            sleep 1
          done

          docker exec ml0-0 curl -sf http://indexer:3031/health
          echo "✓ ML0 can reach indexer directly on tessellation_common network"

      - name: Run webhook integration tests
        env:
          ML0_URL: http://localhost:9200
          INDEXER_URL: http://localhost:3031
          HOST_IP: indexer
        run: npx tsx scripts/test-webhook.ts

      - name: Run traffic generator integration test
        env:
          BRIDGE_URL: http://localhost:3030
          ML0_URL: http://localhost:9200
          INDEXER_URL: http://localhost:3031
          FIBER_WAIT_TIMEOUT: '90'
          DL1_SYNC_WAIT: '15'
          ACTIVATION_WAIT: '10'
          INDEXER_WAIT_TIMEOUT: '30000'
          MAX_RETRIES: '5'
        run: |
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt of $MAX_RETRIES ==="
            if npx tsx packages/traffic-generator/test/integration.test.ts; then
              echo "✓ Test passed on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "⚠️ Test failed, waiting 10s before retry..."
              sleep 10
            fi
          done
          echo "❌ All $MAX_RETRIES attempts failed"
          exit 1

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Versions ==="
          echo "OttoChain: ${{ steps.versions.outputs.ottochain_version }}"
          echo "Tessellation: ${{ steps.versions.outputs.tessellation_version }}"

          echo "=== Container list ==="
          docker ps -a || true

          echo "=== GL0 Logs ==="
          docker logs gl0-0 2>&1 | tail -100 || true
          echo "=== ML0 Logs ==="
          docker logs ml0-0 2>&1 | tail -100 || true
          echo "=== DL1-0 Logs ==="
          docker logs dl1-0 2>&1 | tail -100 || true
          echo "=== DL1-1 Logs ==="
          docker logs dl1-1 2>&1 | tail -50 || true
          echo "=== DL1-2 Logs ==="
          docker logs dl1-2 2>&1 | tail -50 || true
          echo "=== Indexer Logs ==="
          docker logs indexer 2>&1 | tail -100 || true
          echo "=== Bridge Logs ==="
          docker logs bridge 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yaml down 2>/dev/null || true
          docker rm -f redis-ci 2>/dev/null || true
          cd tessellation/docker
          chmod +x bin/*.sh 2>/dev/null || true
          ./bin/compose-runner.sh --down || true

      - name: Summary
        if: always()
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Version | Source |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OttoChain | ${{ steps.versions.outputs.ottochain_version }} | GitHub Release JAR |" >> $GITHUB_STEP_SUMMARY
          echo "| Tessellation | ${{ steps.versions.outputs.tessellation_version }} | GitHub Release JAR |" >> $GITHUB_STEP_SUMMARY
          echo "| Services | $(git rev-parse --short HEAD) | Built from source |" >> $GITHUB_STEP_SUMMARY
